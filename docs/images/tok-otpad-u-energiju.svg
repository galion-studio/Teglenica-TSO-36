<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180" style="font-family:'Noto Sans','DejaVu Sans',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d6e"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/></marker></defs>
<rect width="1400" height="1180" fill="#ffffff"/><rect x="0" y="0" width="1400" height="8" fill="#c8102e"/><text x="40" y="62.0" font-size="32" font-weight="700" fill="#0b3d6e" text-anchor="start">Dijagram toka: od ostatnog otpada do energije</text><text x="40" y="96.0" font-size="17" font-weight="400" fill="#5b6573" text-anchor="start">Pojednostavljeni prikaz prema prijavi projekta „Energetska oporaba otpada u SDŽ” (nacrt za raspravu)</text><rect x="260.0" y="140" width="520" height="104" rx="14" fill="#ffffff" stroke="#0b3d6e" stroke-width="2.5"/><circle cx="264.0" cy="144" r="16" fill="#c8102e" stroke="#fff" stroke-width="2"/><text x="264.0" y="150.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="520.0" y="186.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Komunalni otpad</text><text x="520.0" y="218.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">nastaje u kućanstvima i djelatnostima</text><line x1="520" y1="244" x2="520" y2="276" stroke="#0b3d6e" stroke-width="3" marker-end="url(#ar)"/><rect x="260.0" y="280" width="520" height="104" rx="14" fill="#ffffff" stroke="#0b3d6e" stroke-width="2.5"/><circle cx="264.0" cy="284" r="16" fill="#c8102e" stroke="#fff" stroke-width="2"/><text x="264.0" y="290.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="520.0" y="326.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Odvojeno prikupljanje i recikliranje</text><text x="520.0" y="358.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">red prvenstva: najprije recikliranje</text><line x1="520" y1="384" x2="520" y2="416" stroke="#0b3d6e" stroke-width="3" marker-end="url(#ar)"/><rect x="260.0" y="420" width="520" height="104" rx="14" fill="#ffffff" stroke="#0b3d6e" stroke-width="2.5"/><circle cx="264.0" cy="424" r="16" fill="#c8102e" stroke="#fff" stroke-width="2"/><text x="264.0" y="430.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="520.0" y="466.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Ostatni (miješani) komunalni otpad</text><text x="520.0" y="498.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">otoci ≈ 13.328 t/god. · s kopna i iz MBO-a CGO Lećevica</text><line x1="520" y1="524" x2="520" y2="556" stroke="#0b3d6e" stroke-width="3" marker-end="url(#ar)"/><rect x="260.0" y="560" width="520" height="104" rx="14" fill="#eaf3fb" stroke="#0b3d6e" stroke-width="2.5"/><circle cx="264.0" cy="564" r="16" fill="#c8102e" stroke="#fff" stroke-width="2"/><text x="264.0" y="570.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="520.0" y="606.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Prijevoz u zatvorenim kontejnerima</text><text x="520.0" y="638.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">s otoka: preša → teglenica TSO-36 → kamion</text><line x1="520" y1="664" x2="520" y2="696" stroke="#0b3d6e" stroke-width="3" marker-end="url(#ar)"/><rect x="260.0" y="700" width="520" height="104" rx="14" fill="#ffffff" stroke="#0b3d6e" stroke-width="2.5"/><circle cx="264.0" cy="704" r="16" fill="#c8102e" stroke="#fff" stroke-width="2"/><text x="264.0" y="710.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="520.0" y="746.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Energana: izgaranje na pomičnoj rešetki</text><text x="520.0" y="778.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">≥ 850 °C najmanje 2 s · ≈ 120.000 t/god.</text><line x1="520" y1="804" x2="520" y2="836" stroke="#0b3d6e" stroke-width="3" marker-end="url(#ar)"/><rect x="260.0" y="840" width="520" height="104" rx="14" fill="#ffffff" stroke="#0b3d6e" stroke-width="2.5"/><circle cx="264.0" cy="844" r="16" fill="#c8102e" stroke="#fff" stroke-width="2"/><text x="264.0" y="850.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="520.0" y="886.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Kotao na otpadnu toplinu i parna turbina</text><text x="520.0" y="918.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">≈ 11 – 13 MWe bruto</text><line x1="520" y1="944" x2="520" y2="976" stroke="#0b3d6e" stroke-width="3" marker-end="url(#ar)"/><rect x="260.0" y="980" width="520" height="104" rx="14" fill="#fff6e5" stroke="#e0a000" stroke-width="2.5"/><circle cx="264.0" cy="984" r="16" fill="#c8102e" stroke="#fff" stroke-width="2"/><text x="264.0" y="990.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="520.0" y="1026.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Električna energija u mrežu</text><text x="520.0" y="1058.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">osnovno ≈ 71,5 GWh/god. neto · HEP / tržište</text><rect x="900" y="270" width="440" height="120" rx="14" fill="#f3f6fa" stroke="#5b6573" stroke-width="2.5"/><text x="1120.0" y="316.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Reciklirani materijali</text><text x="1120.0" y="348.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">papir, plastika, staklo, metal…</text><text x="1120.0" y="366.75" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">(izvan energane)</text><line x1="780.0" y1="332" x2="898" y2="332" stroke="#5b6573" stroke-width="3" marker-end="url(#arg)"/><rect x="900" y="690" width="440" height="120" rx="14" fill="#f3f6fa" stroke="#5b6573" stroke-width="2.5"/><text x="1120.0" y="736.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Šljaka (≈ 20 % ulazne mase)</text><text x="1120.0" y="768.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">izdvajanje metala (≈ 10 – 12 %)</text><text x="1120.0" y="786.75" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">za recikliranje</text><line x1="780.0" y1="752" x2="898" y2="752" stroke="#5b6573" stroke-width="3" marker-end="url(#arg)"/><rect x="900" y="830" width="440" height="120" rx="14" fill="#f3f6fa" stroke="#5b6573" stroke-width="2.5"/><text x="1120.0" y="876.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Ostatci pročišćavanja plinova</text><text x="1120.0" y="908.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">≈ 4 % ulazne mase, opasni otpad –</text><text x="1120.0" y="926.75" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">ovlašteno zbrinjavanje (nisu teret broda)</text><line x1="780.0" y1="892" x2="898" y2="892" stroke="#5b6573" stroke-width="3" marker-end="url(#arg)"/><text x="40" y="1160.0" font-size="14" font-weight="400" fill="#5b6573" text-anchor="start">Sve vrijednosti su indikativne (nacrt za raspravu) i podložne studiji izvodljivosti. Lokacija energane nije odabrana (kandidati: Šibenik, Lećevica).</text></svg>