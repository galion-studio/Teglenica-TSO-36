<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" style="font-family:'Noto Sans','DejaVu Sans',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d6e"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/></marker></defs>
<rect width="1600" height="760" fill="#ffffff"/><rect x="0" y="0" width="1600" height="8" fill="#c8102e"/><text x="40" y="62.0" font-size="32" font-weight="700" fill="#0b3d6e" text-anchor="start">Pregled sustava TSO-36: od otoka do energije</text><text x="40" y="96.0" font-size="17" font-weight="400" fill="#5b6573" text-anchor="start">Zatvoreni lanac – otpad cijelim putem ostaje u istom zatvorenom kontejneru (bez otvorenog pretovara)</text><rect x="30" y="130" width="740" height="300" rx="18" fill="#f4f8fb" stroke="#b9cbe0" stroke-dasharray="6 6"/><text x="50" y="160.0" font-size="16" font-weight="700" fill="#5b6573" text-anchor="start">OTOK</text><rect x="830" y="130" width="740" height="300" rx="18" fill="#d9ecf7" stroke="#9cc3df" stroke-dasharray="6 6"/><text x="850" y="160.0" font-size="16" font-weight="700" fill="#5b6573" text-anchor="start">MORE</text><rect x="60" y="200" width="210" height="140" rx="14" fill="#ffffff" stroke="#0b3d6e" stroke-width="2.5"/><circle cx="64" cy="204" r="16" fill="#c8102e" stroke="#fff" stroke-width="2"/><text x="64" y="210.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="165.0" y="246.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Prikupljanje</text><text x="165.0" y="278.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">postojeći komunalni</text><text x="165.0" y="296.75" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">sustav na otoku</text><rect x="305" y="200" width="210" height="140" rx="14" fill="#ffffff" stroke="#0b3d6e" stroke-width="2.5"/><circle cx="309" cy="204" r="16" fill="#c8102e" stroke="#fff" stroke-width="2"/><text x="309" y="210.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="410.0" y="246.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Otočna preša</text><text x="410.0" y="278.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">stacionarni kompaktor</text><text x="410.0" y="296.75" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">(preše nisu na brodu)</text><rect x="550" y="200" width="210" height="140" rx="14" fill="#ffffff" stroke="#0b3d6e" stroke-width="2.5"/><circle cx="554" cy="204" r="16" fill="#c8102e" stroke="#fff" stroke-width="2"/><text x="554" y="210.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="655.0" y="246.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Zatvoreni kontejner</text><text x="655.0" y="278.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">s kukom, DIN 30722</text><text x="655.0" y="296.75" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">≈ 26 m³, ≈ 8 t otpada</text><line x1="270" y1="270" x2="303" y2="270" stroke="#0b3d6e" stroke-width="3" marker-end="url(#ar)"/><line x1="515" y1="270" x2="548" y2="270" stroke="#0b3d6e" stroke-width="3" marker-end="url(#ar)"/><rect x="860" y="200" width="330" height="140" rx="14" fill="#ffffff" stroke="#0b3d6e" stroke-width="2.5"/><circle cx="864" cy="204" r="16" fill="#c8102e" stroke="#fff" stroke-width="2"/><text x="864" y="210.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1025.0" y="246.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Teglenica TSO-36</text><text x="1025.0" y="278.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">9 kontejnera (3 × 3) · ≈ 72 t po putovanju</text><text x="1025.0" y="296.75" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">posada 3 · 2 jednake jedinice</text><rect x="1240" y="200" width="300" height="140" rx="14" fill="#ffffff" stroke="#0b3d6e" stroke-width="2.5"/><circle cx="1244" cy="204" r="16" fill="#c8102e" stroke="#fff" stroke-width="2"/><text x="1244" y="210.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="1390.0" y="246.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Pretovarna luka</text><text x="1390.0" y="278.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">na kopnu</text><text x="1390.0" y="296.75" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">(lokacija nije odabrana)</text><line x1="760" y1="270" x2="858" y2="270" stroke="#0b3d6e" stroke-width="3" marker-end="url(#ar)"/><text x="810" y="255.0" font-size="14" font-weight="700" fill="#0b3d6e" text-anchor="middle">Ro-Ro</text><text x="800" y="300.0" font-size="12" font-weight="400" fill="#5b6573" text-anchor="middle">kamion s kukom</text><line x1="1190" y1="270" x2="1238" y2="270" stroke="#0b3d6e" stroke-width="3" marker-end="url(#ar)"/><path d="M900,380 L1150,380 L1130,410 L920,410 Z" fill="#ffffff" stroke="#0b3d6e" stroke-width="2"/><rect x="940" y="354" width="44" height="26" fill="#9aa7b4" stroke="#0b3d6e"/><rect x="988" y="354" width="44" height="26" fill="#9aa7b4" stroke="#0b3d6e"/><rect x="1036" y="354" width="44" height="26" fill="#9aa7b4" stroke="#0b3d6e"/><rect x="1095" y="342" width="36" height="38" fill="#ffffff" stroke="#0b3d6e" stroke-width="2"/><path d="M900 380 L870 398" stroke="#0b3d6e" stroke-width="3"/><text x="1395" y="395.0" font-size="15" font-weight="600" fill="#0b3d6e" text-anchor="middle">Primjer linije: Vis / Komiža → Split</text><text x="1395" y="418.0" font-size="14" font-weight="400" fill="#5b6573" text-anchor="middle">≈ 30 NM · ≈ 2,7 h plovidbe</text><rect x="30" y="470" width="1540" height="250" rx="18" fill="#efe9dc" stroke="#d6cbb1" stroke-dasharray="6 6"/><text x="50" y="500.0" font-size="16" font-weight="700" fill="#5b6573" text-anchor="start">KOPNO</text><rect x="1240" y="540" width="300" height="140" rx="14" fill="#ffffff" stroke="#0b3d6e" stroke-width="2.5"/><circle cx="1244" cy="544" r="16" fill="#c8102e" stroke="#fff" stroke-width="2"/><text x="1244" y="550.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="1390.0" y="586.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Zatvoreni kamioni</text><text x="1390.0" y="618.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">cestovni prijevoz</text><text x="1390.0" y="636.75" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">do energane</text><rect x="860" y="540" width="330" height="140" rx="14" fill="#ffffff" stroke="#0b3d6e" stroke-width="2.5"/><circle cx="864" cy="544" r="16" fill="#c8102e" stroke="#fff" stroke-width="2"/><text x="864" y="550.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="1025.0" y="586.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Energana u zaleđu</text><text x="1025.0" y="618.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">≥ 15 km od mora, bez pristana</text><text x="1025.0" y="636.75" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">kandidati: Šibenik, Lećevica</text><rect x="480" y="540" width="300" height="140" rx="14" fill="#ffffff" stroke="#0b3d6e" stroke-width="2.5"/><circle cx="484" cy="544" r="16" fill="#c8102e" stroke="#fff" stroke-width="2"/><text x="484" y="550.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">9</text><text x="630.0" y="586.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Električna energija</text><text x="630.0" y="618.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">predaje se u mrežu</text><text x="630.0" y="636.75" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">(HEP / tržište)</text><line x1="1390" y1="340" x2="1390" y2="538" stroke="#0b3d6e" stroke-width="3" marker-end="url(#ar)"/><line x1="1238" y1="610" x2="1192" y2="610" stroke="#0b3d6e" stroke-width="3" marker-end="url(#ar)"/><line x1="858" y1="610" x2="782" y2="610" stroke="#0b3d6e" stroke-width="3" marker-end="url(#ar)"/><rect x="60" y="540" width="360" height="140" rx="14" fill="#fff6e5" stroke="#e0a000" stroke-width="2.5"/><text x="240.0" y="586.0" font-size="20" font-weight="700" fill="#0b3d6e" text-anchor="middle">Korist</text><text x="240.0" y="618.0" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">manje odlaganja otpada,</text><text x="240.0" y="636.75" font-size="15" font-weight="400" fill="#33404f" text-anchor="middle">energija iz ostatnog otpada</text><line x1="478" y1="610" x2="422" y2="610" stroke="#0b3d6e" stroke-width="3" marker-end="url(#ar)"/><text x="1570" y="748" font-size="13" fill="#5b6573" text-anchor="end">Konceptualni prikaz (pre-FEED) – indikativne vrijednosti prema tehničkom planu v3; podložno studiji izvodljivosti</text><text x="655" y="395.0" font-size="14" font-weight="600" fill="#0b3d6e" text-anchor="middle">4 · kratki cestovni prijevoz do</text><text x="655" y="415.0" font-size="14" font-weight="600" fill="#0b3d6e" text-anchor="middle">otočnog pristaništa</text></svg>